[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnmpy"
version = "0.2.0"
description = "Distributed lag non-linear models (DLNM) in Python, a faithful port of the R package dlnm"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.9"
authors = [{name = "Craig Parker"}]
keywords = ["dlnm", "distributed lag", "epidemiology", "time series", "climate", "health", "splines"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]

[project.optional-dependencies]
models = ["statsmodels>=0.13"]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "statsmodels>=0.13", "matplotlib>=3.5", "ruff"]

[project.urls]
Homepage = "https://github.com/Logic06183/dlnmpy"
"R package" = "https://github.com/gasparrini/dlnm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dlnmpy" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["E701", "E702", "E741"]
