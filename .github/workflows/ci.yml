name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch cancels the run still going for the old one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  # the library must import and run the core with numpy/scipy/pandas alone:
  # statsmodels and matplotlib are optional extras
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mixmetapy is deliberately absent: dlnmpy must work without it, and
      # test_twostage.py checks that the deprecated dlnmpy.meta says what to install
      - run: pip install . pytest
      - run: python -c "import dlnmpy, numpy; print(dlnmpy.__version__, numpy.__version__)"
      - run: pytest -q tests/test_basis.py tests/test_crossbasis.py tests/test_predict.py tests/test_attribution.py tests/test_twostage.py

  # the wheel and sdist must build and pass twine's metadata check on every
  # push, so a broken release is caught before a tag is cut
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl && python -c "import dlnmpy; print(dlnmpy.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
