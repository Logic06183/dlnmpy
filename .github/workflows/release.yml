name: release

# Publishes to PyPI when a version tag (v0.7.0, say) is pushed, using PyPI
# "trusted publishing" (OpenID Connect): no API token is stored in GitHub.
#
# One-time setup on PyPI (project dlnmpy > Manage > Publishing > add a new
# pending/trusted publisher): owner Logic06183, repository dlnmpy,
# workflow release.yml, environment pypi. Then on GitHub, Settings >
# Environments > create "pypi" (optionally require a reviewer).
#
# The version in pyproject.toml must match the tag; the check below refuses
# to publish otherwise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject version $ver"; exit 1; }
      - run: pip install -e ".[dev]" build twine
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
      contents: write   # to attach the files to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
